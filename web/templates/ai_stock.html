<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f">
    <title>한스톡 AI 의사결정</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=29">
    <link rel="stylesheet" href="/static/css/ai_stock.css?v=2">
</head>
<body>
<div class="dashboard-container ai-shell">
    <header class="app-header">
        <div>
            <p class="eyebrow">EVIDENCE TO EXECUTION</p>
            <h1>AI 의사결정 <span class="highlight">운영실</span></h1>
        </div>
        <div class="header-actions">
            <a class="nav-button" href="/">한스톡</a>
            <a class="nav-button" href="/narrative-momentum">뉴스</a>
            <a class="nav-button active" href="/ai-stock">AI 전략</a>
            <a class="nav-button" href="/env-settings">환경설정</a>
        </div>
    </header>

    <section class="ai-command">
        <div class="ai-command-fields">
            <label>시장
                <select id="market-select">
                    <option value="KR">한국</option>
                    <option value="US">미국</option>
                </select>
            </label>
            <label>전략
                <select id="strategy-select">
                    <option value="">최근 실행 전략</option>
                </select>
            </label>
        </div>
        <div class="ai-command-actions">
            <button id="refresh-button" class="icon-command" title="새로고침" aria-label="새로고침">
                <i data-lucide="refresh-cw"></i>
            </button>
            <button id="scan-button" class="primary-command">
                <i data-lucide="sparkles"></i><span>AI 분석 실행</span>
            </button>
        </div>
    </section>

    <div id="alert-strip" class="alert-strip" hidden></div>

    <section id="summary-grid" class="summary-grid" aria-label="파이프라인 현황"></section>

    <nav class="pipeline-nav" aria-label="AI 의사결정 단계">
        <button class="pipeline-tab active" data-view="decisions"><i data-lucide="brain-circuit"></i>판단 보드</button>
        <button class="pipeline-tab" data-view="evidence"><i data-lucide="newspaper"></i>뉴스 근거</button>
        <button class="pipeline-tab" data-view="risk"><i data-lucide="shield-check"></i>위험 검증</button>
        <button class="pipeline-tab" data-view="execution"><i data-lucide="route"></i>승인·주문</button>
        <button class="pipeline-tab" data-view="diagnostics"><i data-lucide="activity"></i>진단</button>
    </nav>

    <main class="pipeline-workspace">
        <section class="candidate-pane">
            <div class="pane-heading">
                <div>
                    <span class="section-kicker">LATEST DECISIONS</span>
                    <h2 id="list-title">AI 판단 보드</h2>
                </div>
                <span id="scan-time" class="mono-muted">-</span>
            </div>
            <div id="candidate-list" class="candidate-list">
                <p class="empty-state">데이터를 불러오는 중입니다.</p>
            </div>
        </section>

        <aside class="decision-pane">
            <div id="decision-detail" class="decision-detail">
                <div class="empty-detail">
                    <i data-lucide="mouse-pointer-click"></i>
                    <p>종목을 선택하면 근거부터 주문 상태까지 표시됩니다.</p>
                </div>
            </div>
        </aside>
    </main>
</div>

<div id="plan-dialog" class="modal-backdrop" hidden>
    <form id="plan-form" class="plan-dialog">
        <div class="dialog-heading">
            <div>
                <span class="section-kicker">DETERMINISTIC RISK</span>
                <h2>실행 계획 생성</h2>
            </div>
            <button type="button" id="plan-close" class="icon-command" aria-label="닫기"><i data-lucide="x"></i></button>
        </div>
        <input type="hidden" id="plan-candidate-id">
        <label>진입 가격 <input id="plan-entry" type="number" min="0" step="any" required></label>
        <label>손절 가격 <input id="plan-stop" type="number" min="0" step="any" required></label>
        <label>목표 가격 <input id="plan-target" type="number" min="0" step="any"></label>
        <p class="dialog-note">수량은 AI가 정하지 않습니다. 계좌 현금과 위험 정책으로 서버가 계산합니다.</p>
        <button type="submit" class="primary-command"><i data-lucide="file-check-2"></i><span>위험 검증 후 계획 생성</span></button>
    </form>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="/static/js/ai_stock.js?v=2"></script>
</body>
</html>
